<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Watchlytics</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0f13;
        --fg: #f2f3f7;
        --muted: #9aa0ad;
        --like: #35c98b;
        --pass: #e0525f;
      }
      * { box-sizing: border-box; }

      /* O card voa para ±1.4x a largura da tela e, mesmo sendo absoluto,
         continua contando para a área de rolagem do documento — era daí que
         vinham as duas barras.

         `clip` só no eixo X: mata a barra horizontal por definição, sem criar
         contêiner de rolagem. O eixo Y fica rolável de propósito, senão em
         tela baixa os botões ficam inalcançáveis — e eles são o caminho
         não-gestual exigido pela acessibilidade. O movimento vertical do card
         é limitado no Deck para não gerar barra sozinho. */
      html, body { overflow-x: clip; }

      body {
        margin: 0;
        /* dvh, não %: porcentagem não resolve contra a altura `auto` do html,
           e sem altura definida o grid não centraliza nada */
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .deck-wrap { display: grid; gap: 1.25rem; justify-items: center; }

      .deck {
        position: relative;
        /* O terceiro termo é o que impede o `overflow: clip` de cortar algo:
           limita a largura pelo que sobra de altura (botões, folgas, o topo
           do stack e a linha de filtros ≈ 17rem), então em tela baixa o deck
           encolhe em vez de vazar. O `max` põe um piso — abaixo disso o card
           seria ilegível de qualquer jeito, e aí a página rola mesmo.

           A reserva é fixa porque CSS não mede quantas linhas os filtros
           ocuparam; 17rem é o caso de duas linhas, que é o que acontece de
           360px de largura para cima. */
        width: min(22rem, 88vw, max(11rem, calc((100dvh - 17rem) * 2 / 3)));
        aspect-ratio: 2 / 3;
      }

      .deck-card {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.5);
        will-change: transform;
        /* a página não rola mais, então o gesto é inteiramente nosso — evita o
           navegador roubar um arrasto diagonal para scroll ou pull-to-refresh */
        touch-action: none;
        /* o texto escala com o card, não com a viewport: quando o deck encolhe
           em tela baixa, a tipografia acompanha em vez de transbordar */
        container-type: inline-size;
      }

      .card {
        height: 100%;
        padding: clamp(0.7rem, 5.5cqi, 1.25rem);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        background: linear-gradient(transparent 45%, rgb(0 0 0 / 0.55));
      }
      .card-meta {
        font-size: clamp(0.6rem, 3.4cqi, 0.75rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card-title {
        margin: 0.35rem 0;
        font-size: clamp(1rem, 7.3cqi, 1.6rem);
        line-height: 1.15;
      }
      .card-original {
        color: var(--muted);
        font-size: clamp(0.7rem, 4cqi, 0.9rem);
      }
      .card-genres {
        margin: 0.5rem 0;
        font-size: clamp(0.65rem, 3.6cqi, 0.8rem);
        color: var(--muted);
      }
      .card-overview {
        margin: 0;
        font-size: clamp(0.72rem, 4.3cqi, 0.95rem);
        /* último recurso: em card muito baixo, corta a sinopse em vez de vazar */
        overflow: hidden;
      }

      .badge {
        position: absolute;
        top: 1.25rem;
        padding: 0.35rem 0.9rem;
        border: 3px solid currentColor;
        border-radius: 10px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        z-index: 2;
        pointer-events: none;
      }
      .badge-like { left: 1.25rem; color: var(--like); transform: rotate(-12deg); }
      .badge-pass { right: 1.25rem; color: var(--pass); transform: rotate(12deg); }

      .actions { display: flex; gap: 0.75rem; align-items: center; }
      .actions button {
        min-width: 6rem;
        padding: 0.7rem 1.2rem;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 0.18);
        background: rgb(255 255 255 / 0.06);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .actions button:first-child:hover { border-color: var(--pass); color: var(--pass); }
      .actions button:last-child:hover { border-color: var(--like); color: var(--like); }
      .actions button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
      .actions .undo {
        min-width: 0;
        padding: 0.7rem 1rem;
        color: var(--muted);
        background: none;
        border-color: transparent;
      }
      .actions .undo:disabled { opacity: 0.35; cursor: default; }
      .actions .undo:not(:disabled):hover { color: var(--fg); }

      .notice .link {
        margin-top: 0.75rem;
        padding: 0.5rem 1rem;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 0.18);
        background: none;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        max-width: min(30rem, 92vw);
      }
      .filters select, .filters input {
        padding: 0.45rem 0.6rem;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 0.18);
        background: rgb(255 255 255 / 0.06);
        color: var(--fg);
        font: inherit;
        font-size: 0.9rem;
      }
      /* o campo de ano não precisa da largura de um select */
      .filters input { width: 5.5rem; }

      .notice { text-align: center; color: var(--muted); max-width: 22rem; }
      .notice.error { color: var(--pass); }
      .notice-hint { font-size: 0.9rem; }

      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .deck-card { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
