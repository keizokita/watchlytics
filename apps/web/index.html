<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Watchlytics</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0f13;
        --fg: #f2f3f7;
        --muted: #9aa0ad;
        --like: #35c98b;
        /* Clareado de #e0525f: como TEXTO sobre a superfície do botão Pass
           (--surface sobre --bg) o valor antigo dava 4.44:1 e reprovava AA por
           um triz. Aqui dá 5.2:1, e a mesma cor ainda serve de traço. */
        --pass: #e8636f;

        /* Superfície, traço e raio de pílula: pílula de filtro, campo de ano,
           botão de ação e chip do card são a MESMA coisa visual. Antes cada
           regra repetia o rgba na mão e elas iam divergindo. */
        --surface: rgb(255 255 255 / 0.06);
        --surface-hi: rgb(255 255 255 / 0.12);
        --line: rgb(255 255 255 / 0.16);
        --r-pill: 999px;
        --r-card: 22px;

        /* Alvo de toque mínimo (44px, WCAG 2.5.8). Vale para botão, select e
           campo — é por isso que é token e não número solto. */
        --tap: 2.75rem;

        /* Altura que NÃO é do deck: padding do body, nav, filtros em duas
           linhas, a folga do deck-wrap e a fileira de botões. É o que impede
           o `overflow: clip` de cortar algo — veja `.deck`. */
        --deck-reserve: 19.5rem;
        /* Largura do deck em um lugar só: o fantasma do estado "carregando"
           precisa da mesma medida, e duas fórmulas iguais divergem. */
        --deck-w: min(22rem, 88vw, max(11rem, calc((100dvh - var(--deck-reserve)) * 2 / 3)));
      }
      * { box-sizing: border-box; }

      /* O card voa para ±1.4x a largura da tela e, mesmo sendo absoluto,
         continua contando para a área de rolagem do documento — era daí que
         vinham as duas barras.

         `clip` só no eixo X: mata a barra horizontal por definição, sem criar
         contêiner de rolagem. O eixo Y fica rolável de propósito, senão em
         tela baixa os botões ficam inalcançáveis — e eles são o caminho
         não-gestual exigido pela acessibilidade. O movimento vertical do card
         é limitado no Deck para não gerar barra sozinho. */
      html, body { overflow-x: clip; }

      body {
        margin: 0;
        /* dvh, não %: porcentagem não resolve contra a altura `auto` do html,
           e sem altura definida o grid não centraliza nada */
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        /* viewport-fit=cover no meta: em tela com recorte o rodapé de botões
           não pode ficar embaixo da barra do sistema */
        padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* Foco visível em tudo que recebe foco, uma regra só. `:where` mantém a
         especificidade em zero, então qualquer regra abaixo ainda ajusta o
         offset sem precisar de !important. */
      :where(a, button, select, input, [tabindex]):focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 2px;
      }

      /* ─── deck ─────────────────────────────────────────────────────────── */

      .deck-wrap { display: grid; gap: 1.25rem; justify-items: center; }

      .deck {
        position: relative;
        /* O terceiro termo da --deck-w é o que impede o `overflow: clip` de
           cortar algo: limita a largura pelo que sobra de altura (botões,
           folgas, o topo do stack, a nav e a linha de filtros ≈ --deck-reserve),
           então em tela baixa o deck encolhe em vez de vazar. O `max` põe um
           piso — abaixo disso o card seria ilegível de qualquer jeito, e aí a
           página rola mesmo.

           A reserva é fixa porque CSS não mede quantas linhas os filtros
           ocuparam; 19.5rem é o caso de duas linhas, que é o que acontece de
           360px de largura para cima. Subiu de 17rem quando filtros e botões
           passaram a respeitar o alvo de toque de 44px (--tap) e o aviso de
           login ganhou linha própria na nav. */
        width: var(--deck-w);
        aspect-ratio: 2 / 3;
      }

      .deck-card {
        position: absolute;
        inset: 0;
        border-radius: var(--r-card);
        overflow: hidden;
        /* sombra baixa e espalhada + fio de luz na borda: sem o fio, card
           escuro sobre fundo escuro perde o recorte */
        box-shadow:
          0 18px 45px -12px rgb(0 0 0 / 0.75),
          inset 0 0 0 1px rgb(255 255 255 / 0.09);
        will-change: transform;
        /* a página não rola mais, então o gesto é inteiramente nosso — evita o
           navegador roubar um arrasto diagonal para scroll ou pull-to-refresh */
        touch-action: none;
        /* o texto escala com o card, não com a viewport: quando o deck encolhe
           em tela baixa, a tipografia acompanha em vez de transbordar */
        container-type: inline-size;
      }

      /* Os de baixo existem só para dar profundidade. Cada card sorteia o hue
         pelo id, então a faixa que sobra no topo saía em três cores diferentes
         — lia como defeito de renderização, não como pilha. Apagados, viram
         sombra: o olho vai para o card do topo. */
      .deck-card[aria-hidden="true"] {
        filter: brightness(0.55) saturate(0.45);
        box-shadow: 0 10px 30px -14px rgb(0 0 0 / 0.6);
      }

      .card {
        height: 100%;
        padding: clamp(0.7rem, 5.5cqi, 1.25rem);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 0.75rem;
        overflow: hidden;
        /* Duas pontas escuras, não uma: o topo carrega os chips e o rodapé
           carrega o texto. Sem a parada de cima o chip ficava sobre a parte
           clara do gradiente; sem a de baixo em 0.72 o --muted não fechava AA
           contra os hues mais claros que `gradient(id)` sorteia. */
        background: linear-gradient(
          rgb(0 0 0 / 0.38),
          rgb(0 0 0 / 0) 28%,
          rgb(0 0 0 / 0) 42%,
          rgb(0 0 0 / 0.72)
        );
      }

      .card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
      }
      /* Tipo e nota sobem para o topo do card: davam uma linha cinza a mais no
         rodapé e a nota é o que decide o swipe. Em cima, o card ganha dois
         pontos de ancoragem em vez de um bloco só. */
      .card-kind, .card-score {
        padding: 0.3em 0.65em;
        border-radius: var(--r-pill);
        background: rgb(0 0 0 / 0.5);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.2);
        font-size: clamp(0.6rem, 3.4cqi, 0.75rem);
        font-weight: 700;
        line-height: 1;
        white-space: nowrap;
      }
      .card-kind { letter-spacing: 0.09em; text-transform: uppercase; color: var(--fg); }
      .card-score { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

      .card-body { display: grid; gap: 0.25rem; min-height: 0; }
      .card-title {
        margin: 0;
        font-size: clamp(1.05rem, 7.6cqi, 1.7rem);
        line-height: 1.12;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .card-original {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.7rem, 4cqi, 0.9rem);
      }
      .card-meta {
        margin: 0.15rem 0 0.35rem;
        font-size: clamp(0.65rem, 3.6cqi, 0.8rem);
        color: var(--muted);
        /* ano + gêneros em uma linha só: com wrap, um título de quatro gêneros
           empurrava a sinopse para fora do card */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card-overview {
        margin: 0;
        font-size: clamp(0.72rem, 4.3cqi, 0.95rem);
        line-height: 1.45;
        /* três linhas fixas: corta a sinopse em vez de vazar (era o `overflow:
           hidden` de antes) e mantém o rodapé na mesma altura de um card para
           o outro — sem isso a pilha "pulsava" a cada swipe */
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        overflow: hidden;
      }

      /* ─── carimbos de like/pass ────────────────────────────────────────── */

      /* --swipe vem do Deck: -1 no limiar de pass, +1 no de like. `opacity`
         fora de 0–1 é clampada pelo próprio CSS, então cada carimbo lê só o
         seu lado do sinal e o JS não precisa devolver dois valores. */
      .badge {
        position: absolute;
        /* abaixo da fileira de chips: em cima o carimbo cobria o "SERIES" e os
           dois ficavam ilegíveis exatamente no momento em que o gesto importa */
        top: clamp(2.6rem, 16cqi, 3.6rem);
        padding: 0.35rem 0.9rem;
        border: 3px solid currentColor;
        border-radius: 12px;
        background: rgb(0 0 0 / 0.45);
        font-size: clamp(0.85rem, 6cqi, 1.3rem);
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        z-index: 2;
        pointer-events: none;
      }
      .badge-like {
        left: clamp(0.8rem, 6cqi, 1.5rem);
        color: var(--like);
        opacity: var(--swipe, 0);
        transform: rotate(-12deg) scale(clamp(0.82, calc(0.82 + 0.18 * var(--swipe, 0)), 1));
      }
      .badge-pass {
        right: clamp(0.8rem, 6cqi, 1.5rem);
        color: var(--pass);
        opacity: calc(-1 * var(--swipe, 0));
        transform: rotate(12deg) scale(clamp(0.82, calc(0.82 - 0.18 * var(--swipe, 0)), 1));
      }

      /* ─── botões de ação ───────────────────────────────────────────────── */

      .actions { display: flex; gap: 0.6rem; align-items: center; justify-content: center; }
      .actions button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 6.5rem;
        min-height: var(--tap);
        padding: 0 1.2rem;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 120ms, border-color 120ms, color 120ms, transform 120ms;
      }
      .actions button:active:not(:disabled) { transform: scale(0.96); }
      /* Classe, não :first-child/:last-child: a ordem já mudou uma vez (B7
         enfiou o Undo entre Pass e Like) e a regra teria trocado de dono
         calada. */
      .actions .pass { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 38%, transparent); }
      .actions .like { color: var(--like); border-color: color-mix(in srgb, var(--like) 38%, transparent); }
      .actions .pass:hover { border-color: var(--pass); background: color-mix(in srgb, var(--pass) 16%, transparent); }
      .actions .like:hover { border-color: var(--like); background: color-mix(in srgb, var(--like) 16%, transparent); }
      /* Undo é terciário: desfazer não pode competir com decidir. */
      .actions .undo {
        min-width: 0;
        padding: 0 0.9rem;
        color: var(--muted);
        background: none;
        border-color: transparent;
        font-weight: 500;
      }
      .actions .undo:disabled { opacity: 0.35; cursor: default; }
      .actions .undo:not(:disabled):hover { color: var(--fg); background: var(--surface); }

      /* ─── filtros ──────────────────────────────────────────────────────── */

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
        align-items: center;
        /* 37rem cabe os quatro controles em uma linha no desktop; em 360px a
           quebra cai em duas linhas, que é o caso previsto na --deck-reserve */
        max-width: min(37rem, 94vw);
      }
      /* <select> se dimensiona pela MAIOR opção, e "Action & Adventure" fazia o
         de gênero sozinho ocupar 177px — teto e reticências em vez disso. O
         teto é o necessário para "Any language", o mais largo dos rótulos
         padrão, caber inteiro. */
      .filters select { max-width: 9.5rem; text-overflow: ellipsis; }
      .filters select, .filters input {
        min-height: var(--tap);
        padding: 0 0.85rem;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .filters select:hover, .filters input:hover { border-color: var(--surface-hi); }
      /* o cinza padrão do Chrome para placeholder não fecha AA sobre --surface */
      .filters input::placeholder { color: var(--muted); opacity: 1; }

      /* "de/até" é um controle só: separados, quebravam em linhas diferentes
         em 360px e estouravam a reserva de altura do deck. */
      .filter-range {
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: var(--r-pill);
      }
      .filters .filter-range input {
        width: 4.5rem;
        padding: 0 0.6rem;
        text-align: center;
        border: 0;
        border-radius: var(--r-pill);
        background: none;
        cursor: text;
      }
      .filters .filter-range input + input { box-shadow: -1px 0 0 var(--line); }
      /* o foco mora dentro da pílula, senão o outline vaza por cima do vizinho */
      .filters .filter-range input:focus-visible { outline-offset: -3px; }
      /* as setinhas do input number custam ~20px de largura e ninguém clica
         nelas para digitar um ano */
      .filters input[type="number"] { appearance: textfield; -moz-appearance: textfield; }
      .filters input::-webkit-outer-spin-button,
      .filters input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

      /* ─── estados: vazio, carregando, erro ─────────────────────────────── */

      .notice { text-align: center; color: var(--muted); max-width: 22rem; margin: 0; }
      .notice p { margin: 0; }

      /* `deck-slot` é a classe que main.tsx põe nos três estados que ocupam o
         lugar do deck. Reservar a pegada dele evita a tela inteira saltar de
         500px quando o feed troca de estado — nav e filtros ficam no lugar.
         (O `.notice` cru continua servindo aviso solto: banner de filtro
         afrouxado, Library, Login.) */
      .notice.deck-slot {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 0.85rem;
        min-height: calc(var(--deck-w) * 1.5);
        font-size: 1.05rem;
        color: var(--fg);
        text-wrap: balance;
      }
      .notice.deck-slot .notice-hint { font-size: 0.9rem; color: var(--muted); }

      /* Vazio: contorno com a pegada do card. Sem ele o "acabou" era uma frase
         boiando num buraco do tamanho do deck — o contorno diz QUE lugar está
         vazio. */
      .notice.empty {
        width: var(--deck-w);
        padding: 1.25rem;
        border-radius: var(--r-card);
        background: rgb(255 255 255 / 0.02);
        box-shadow: inset 0 0 0 1px var(--line);
      }

      /* Carregando: o texto sozinho não dizia "o deck está vindo", só encolhia
         a página. O fantasma tem a medida exata do card e da fileira de
         botões. */
      .notice.loading { min-height: 0; gap: 1.25rem; }
      .notice.loading::before {
        content: "";
        /* medida exata do card: quando o feed chega, o deck nasce no lugar do
           fantasma em vez de empurrar a página */
        width: var(--deck-w);
        height: calc(var(--deck-w) * 1.5);
        border-radius: var(--r-card);
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--line);
        animation: ghost 1.5s ease-in-out infinite;
      }
      @keyframes ghost { 50% { opacity: 0.4; } }

      .notice.error { color: var(--pass); }
      /* O que falhou foi o deck, então o erro ocupa o lugar dele: painel com a
         mesma pegada, em vez de uma linha vermelha solta no meio da página. */
      .notice.deck-slot.error {
        color: var(--pass);
        border: 1px solid color-mix(in srgb, var(--pass) 35%, transparent);
        background: color-mix(in srgb, var(--pass) 8%, transparent);
        border-radius: var(--r-card);
        padding: 1.25rem;
      }

      .notice .link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--tap);
        padding: 0 1.1rem;
        border-radius: var(--r-pill);
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .notice .link:hover { background: var(--surface-hi); border-color: var(--surface-hi); }

      /* O aviso de login mora dentro da <nav>. Em 360px ele disputava largura
         com os links e virava três linhas de 16px; linha própria e corpo
         menor devolvem essa altura para o deck. (`flex-wrap` aqui porque o
         `display:flex` da nav vem do <style> do shell, em main.tsx.) */
      nav { flex-wrap: wrap; justify-content: center; align-items: center; }
      nav .notice {
        flex-basis: 100%;
        font-size: 0.78rem;
        line-height: 1.35;
        max-width: 24rem;
      }
      /* C5 — quebra de linha própria: o aviso pertence ao botão de entrar */
      .consent { display: block; font-size: 0.72rem; margin-top: 0.35rem; }
      .notice-hint { font-size: 0.9rem; }

      /* D5 — o toggle do perfil público mora na seção de conta */
      .lib-public { display: flex; gap: 0.5rem; align-items: center; justify-content: center; }

      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        .deck-card { transition: none !important; }
        .actions button { transition: none; }
        .actions button:active:not(:disabled) { transform: none; }
        /* o carimbo continua aparecendo — é o que diz para onde o card vai —,
           só perde o crescimento */
        .badge-like { transform: rotate(-12deg); }
        .badge-pass { transform: rotate(12deg); }
        .notice.loading::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
