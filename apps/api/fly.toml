app = "watchlytics-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

# Roda antes de trocar as máquinas: se a migration falhar, o deploy aborta.
#
# O seed saiu daqui em 2026-09-08, quando o catálogo real entrou: ingestão do
# TMDB com --min-votes 800 (anime 80, reality 50) → 7583 títulos, e os 94 da
# fixture apagados por `provider = 'fixture'` em title_external_ids.
#
# NÃO devolva o seed. Fixture e tmdb são providers disjuntos: o seed não
# sobrescreve a ingestão, ele CONVIVE. Os 94 são populares (The Matrix,
# Inception, Parasite) e o /discover traz os mesmos com outro uuid; o A2 exclui
# por title_id (routes/feed.ts:173-190), então a cópia gêmea reaparece depois do
# swipe — duplicata quebra a garantia de não-repetição, não é só ruído no deck.
#
# Para recarregar ou baixar a régua: `node apps/api/src/ingest/run.ts
# --min-votes N` dentro da máquina (o TMDB_READ_TOKEN já é secret). Baixar a
# régua só insere. SUBIR exige DELETE, e as FKs são ON DELETE CASCADE
# (db/schema.ts:139,168,193,260): leva junto swipe, biblioteca e match de quem
# já avaliou. É por isso que a régua começou apertada.
[deploy]
  release_command = "node apps/api/src/db/migrate.ts"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # ponytail: suspender custa quase zero e cobra ~6s de boot na primeira
  # requisição. O preço real não é a espera: é o proxy responder PM11 enquanto
  # a máquina sobe, e o `code` do Google (uso único) morrer junto — foi assim
  # que o primeiro login de verdade se perdeu. O cliente retenta em 5xx, o que
  # cobre o caso. Subir para 1 quando alguém reclamar de login, e aí custa
  # ~US$3/mês em vez de centavos.
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
